[package]
name = "bower"
description = "The Bower CLI: replays a book's plan into deterministic git repositories. Owns every side effect the kernel refuses — filesystem, configuration, and git."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Both binaries are declared explicitly, so neither depends on cargo's
# auto-discovery. That also keeps the preprocessor out of `src/bin/`, which a
# common global gitignore rule (`bin`) would silently exclude from commits.
autobins = false

[[bin]]
name = "bower"
path = "src/main.rs"

[[bin]]
name = "mdbook-bower"
path = "src/mdbook_bower.rs"
required-features = ["preprocessor"]

[features]
default = ["preprocessor"]
# The mdBook preprocessor and the one dependency it needs. Building without it
# yields the plain CLI, which is the check that the boundary is real.
preprocessor = ["dep:serde_json"]

[dependencies]
# A dependency lands in the phase that uses it, never before. Versions are
# pinned once in the workspace manifest so two crates cannot disagree.
bower-core = { workspace = true }
clap = { workspace = true }
gix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
time = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Only so the loader can be pinned against the testkit's `include_str!` fixture.
bower-testkit = { workspace = true }
# The preprocessor tests build mdBook envelopes by hand.
serde_json = { workspace = true }
