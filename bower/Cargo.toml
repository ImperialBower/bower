[package]
name = "bower"
description = "The Bower CLI: replays a book's plan into deterministic git repositories. Owns every side effect the kernel refuses — filesystem, configuration, and git."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# A dependency lands in the phase that uses it, never before. `gix` arrives
# with replay (Phase 3). `time` was scheduled for Phase 3 but is needed here:
# the epoch has to be validated at load, not at commit.
bower-core = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
time = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Only so the loader can be pinned against the testkit's `include_str!` fixture.
bower-testkit = { workspace = true }
