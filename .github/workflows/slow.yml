# The lanes `make ayce` leaves out.
#
# `make slow` runs the `#[ignore]`d tests: the 20-step verification sweep (a
# real compiler run per step), a real mdbook build through the preprocessor,
# and the epub and PDF publish tests. They are ignored by default because they
# are a tax on every `cargo test` — which makes CI, not a developer's laptop,
# the right place to pay it.
#
# It is also the only lane that needs the tools outside the Rust toolchain, so
# it starts by running ./bin/check-dependencies: when this job fails, the first
# thing the log says is whether a tool was missing or a test was wrong.
#
# Not on pull requests: it is minutes of compiler runs, and the tools it needs
# are installed fresh each time. It runs on main, on a weekly schedule — pandoc,
# typst and mdbook move on their own, and a book that renders wrongly because a
# tool changed under it is exactly what these tests exist to catch — and on
# demand.

name: slow

on:
  push:
    branches: [main]
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: slow-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  slow:
    name: ignored lanes
    runs-on: ubuntu-latest
    env:
      # Where the Libertinus step below puts its fonts. Typst scans the system
      # directories anyway; naming the directory outright means the PDF lane
      # does not depend on which directories those turn out to be. `bower`
      # invokes typst as a child process, so it inherits this.
      TYPST_FONT_PATHS: /usr/local/share/fonts/libertinus
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2

      # mdbook is deliberately unpinned. `bower::mdbook` reads both the 0.4
      # and the 0.5 envelope key, and the `#[ignore]`d preprocessor test is
      # what proves it — pinning here would hide the next rename instead of
      # reporting it.
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook,cargo-audit,cargo-deny

      # Typst is not in install-action's tool list, and its cargo-binstall
      # fallback cannot stand in: the `typst` crate on crates.io is the
      # compiler *library* and ships no binary, so binstall fails with "no
      # binaries specified nor inferred". The CLI only exists as a release
      # artifact, so take it from there. Unpinned, for the same reason mdbook
      # is — this lane exists to notice a tool moving under the book. It is
      # installed before the font check below, so that check asks the tool
      # that will actually use the fonts.
      - name: install typst
        run: |
          curl -fsSL https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz \
            | sudo tar -xJf - --strip-components=1 -C /usr/local/bin \
                typst-x86_64-unknown-linux-musl/typst
          typst --version

      # pandoc is pinned, for the same reason the fonts below are: it is a
      # renderer the byte-identical PDF test makes a claim about. Its Typst
      # writer changes which helper functions it emits between versions — the
      # pandoc in Ubuntu 24.04 writes `#blockquote[…]` where 3.11 writes
      # `#quote(block: true)` — and it renames the media it embeds in an epub,
      # which `publish_epub_produces_a_readable_book` asserts by name. A
      # renderer that moves underneath those tests is them failing for a reason
      # that has nothing to do with this repository.
      #
      # Coping with the other pandoc is a separate job, and not CI's:
      # `publish::PANDOC_TYPST_HELPERS` defines the helpers the older writer
      # assumes, so a reader on a distro pandoc still gets a PDF.
      - name: install pandoc, pinned
        run: |
          sudo apt-get update
          curl -fsSL -o /tmp/pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo apt-get install --no-install-recommends -y /tmp/pandoc.deb
          pandoc --version | head -1

      - name: install the fonts books/hello-playbook/template.typ names
        # Typst substitutes silently for a font it cannot see, and
        # `publish::check_fonts` refuses rather than let it — so the faces the
        # template names have to be on the machine, by those exact names.
        #
        # Ubuntu 24.04 ships no `fonts-libertinus` package — Debian has one,
        # noble does not — so Libertinus comes from its own release, pinned to
        # a version: a font that changes underneath the byte-identical PDF test
        # is that test failing for a reason that has nothing to do with this
        # repository. DejaVu Sans Mono is embedded in typst itself; it is
        # installed here anyway, so pandoc and the epub see the same face.
        run: |
          sudo apt-get install --no-install-recommends -y fonts-dejavu unzip
          curl -fsSL -o /tmp/libertinus.zip \
            https://github.com/alerque/libertinus/releases/download/v7.051/Libertinus-7.051.zip
          sudo mkdir -p /usr/local/share/fonts/libertinus
          sudo unzip -qj /tmp/libertinus.zip 'Libertinus-7.051/static/OTF/*.otf' \
            -d /usr/local/share/fonts/libertinus
          sudo fc-cache -f

      - name: the fonts the template names are the fonts typst can see
        # The check `check_fonts` would make, made here, where the log says
        # "the font is missing" instead of "the PDF lane failed".
        run: |
          typst fonts | grep -qx 'Libertinus Serif'
          typst fonts | grep -qx 'DejaVu Sans Mono'

      # A gate, not a step: a missing tool is named in a second here instead of
      # surfacing as a test failure minutes in.
      - run: make check-dependencies

      - run: make slow

      # The sample book, rendered through the preprocessor.
      - run: make book

      # The real book, planned, verified against this rustc, and checked for
      # drift. `verify` compiles once per step, which is the point: the day a
      # new compiler changes a diagnostic the book quotes, this is what says
      # so. Nothing here touches a network — `make failures` stops before
      # `push`, so publishing stays a decision someone makes at a terminal.
      - run: make failures
