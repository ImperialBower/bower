[workspace]
resolver = "2"
members = ["bower", "bower-core", "bower-testkit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ImperialBower/bower"
authors = ["ImperialBower"]

[workspace.dependencies]
bower-core = { path = "bower-core", version = "0.1.0" }
bower-testkit = { path = "bower-testkit", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
gix = "0.87"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }
toml = "1"
proptest = "1"
rstest = "0.23"
