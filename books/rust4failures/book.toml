[book]
title = "Rust for Failures"
description = "How controlled failing is the way to build solid systems."
authors = ["folkengine"]
language = "en"
src = "src"

# Requires the `mdbook-bower` binary on PATH. `make failures` puts it there;
# by hand it is:
#   cargo build -p bower && export PATH="$PWD/target/debug:$PATH"
# Without it, `mdbook build` fails rather than quietly rendering a book whose
# directives were never applied.
[preprocessor.bower]
command = "mdbook-bower"

[output.html]
default-theme = "ayu"
additional-css = ["theme/step-meta.css"]

# No "Run this code" button. mdBook offers one on every Rust block, which
# sends the snippet to play.rust-lang.org wrapped in its own `fn main()`.
# That is the wrong answer twice over here: a block is a fragment of a file
# the sandbox never sees, and a `compile_fail` or `test_fail` step is
# *supposed* to break — the sandbox would report some other error instead of
# the one the chapter teaches. Readers run the real thing, in a real clone,
# with the command the exercise box prints.
[output.html.playground]
runnable = false
