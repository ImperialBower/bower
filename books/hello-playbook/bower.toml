# The replay layer's configuration. `bower/src/config.rs` parses this file;
# `bower-core` never sees it, and only `keep_region_markers` crosses into the
# kernel's `RepoCatalog`.

[book]
# The timestamp base for deterministic commit SHAs. Replay never reads a clock:
# every commit's time is this epoch plus its step number, in minutes.
epoch = 2026-09-01T00:00:00Z
site = "https://abstecker.github.io/hello-playbook"
# The edition. `bower push` hangs a GitHub release off `v0.1.0` and attaches
# every `.pdf` and `.epub` in the repo's `assets` directory. Absent means the
# book publishes no releases, which is a normal book.
version = "0.1.0"

[identity]
name = "ImperialBower Bower"
email = "bower@imperialbower.example"

[repos.hello-playbook]
# The remote this book publishes to. Without this key `bower push` reports
# "does not publish it" and never dials out.
github = "abstecker/hello-playbook"
# The branch that serves the rendered book.
site_branch = "gh-pages"
# Book-relative, like `template`: an artifact of a book belongs to that book.
# `make epub` and `make pdf` render into it; `bower push` attaches what it finds.
assets = "published"
template = "template"
keep_region_markers = false
# Two commands, because the book distinguishes "does not compile" from
# "compiles, tests fail". `bower verify` needs both to tell them apart.
check = "cargo check"
verify = "cargo test"

[repos.hello-playbook.links]
# Three templates, three questions a reader might have about a block: which
# lines, what changed, and what the whole repo looked like. Point them at
# Codeberg or a self-hosted forge and every link in the book follows.
blob = "https://github.com/abstecker/hello-playbook/blob/{tag}/{path}#L{start}-L{end}"
tree = "https://github.com/abstecker/hello-playbook/tree/{tag}"
commit = "https://github.com/abstecker/hello-playbook/commit/{tag}"
